</div>

<span>Sonraki Soru</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function() {
    const cards = document.querySelectorAll('.option-card');
    const feedbackPanel = document.getElementById('feedback-panel');
    const soundBtn = document.getElementById('sound-btn');
    const nextBtn = document.getElementById('next-btn');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.classList.remove('is-selected', 'ring-2', 'ring-primary-container', 'shadow-[0_8px_20px_rgba(108,92,231,0.18)]');
          c.classList.add('shadow-sm');
          const badge = c.querySelector('.w-7.h-7');
          badge.className = 'w-7 h-7 rounded-full bg-surface-container flex items-center justify-center font-label-md text-label-md text-on-surface-variant';
          const chk = c.querySelector('.check-icon');
          chk.classList.remove('opacity-100');
          chk.classList.add('opacity-0');
        });

        card.classList.add('is-selected', 'ring-2', 'ring-primary-container', 'shadow-[0_8px_20px_rgba(108,92,231,0.18)]');
        card.classList.remove('shadow-sm');

        const activeBadge = card.querySelector('.w-7.h-7');
        activeBadge.className = 'w-7 h-7 rounded-full bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center shadow-sm';
        
        const activeCheck = card.querySelector('.check-icon');
        activeCheck.classList.remove('opacity-0');
        activeCheck.classList.add('opacity-100');
      });
    });

    if (soundBtn) {
      soundBtn.addEventListener('click', () => {
        soundBtn.classList.add('scale-95', 'bg-primary-fixed');
        setTimeout(() => soundBtn.classList.remove('scale-95', 'bg-primary-fixed'), 250);
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        nextBtn.classList.add('scale-95');
        setTimeout(() => nextBtn.classList.remove('scale-95'), 180);
      });
    }
  })();
